<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Sistema de Stock y Fidelización</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background: #444;
      color: white;
      padding: 15px 30px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h2 {
      margin-top: 0;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      color: #444;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      font-size: 14px;
    }

    button {
      background: #444;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #222;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f2f2f2;
      color: #333;
    }
  </style>
</head>
<body>
  <header>Sistema de Stock y Fidelización</header>

  <div class="container">
    <!-- Panel Stock -->
    <div class="card">
      <h2>Control de Stock</h2>
      <input type="text" placeholder="Código del producto">
      <input type="text" placeholder="Nombre del producto">
      <input type="number" placeholder="Cantidad">
      <button>Agregar producto</button>

      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Mouse</td>
            <td>15</td>
            <td><button>Vender</button> <button>Reponer</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Panel Fidelización -->
    <div class="card">
      <h2>Fidelización de Clientes</h2>
      <input type="text" placeholder="Nombre del cliente">
      <input type="text" placeholder="DNI">
      <input type="text" placeholder="Teléfono">
      <input type="email" placeholder="Correo electrónico">
      <button>Registrar cliente</button>

      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Puntos</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Ana Pérez</td>
            <td>12345678</td>
            <td>351-555123</td>
            <td>ana@mail.com</td>
            <td>20</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
