<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login de Empleados</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6368fe, #76c5ed);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-container img {
      width: 200px;
      margin-bottom: 15px;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s;
    }

    .login-container input:focus {
      border: 1px solid #667eea;
      outline: none;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background-color: #66ea90;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .login-container button:hover {
      background-color: #11cc0b;
      transform: scale(1.05);
    }

    .login-container p {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="/login-cart.png" alt="Login">
    <h2>Bienvenido de nuevo</h2>
    <form method="POST" action="/auth/login">
      <input type="text" name="usuario" placeholder="👤 Usuario" required />
      <input type="password" name="contraseña" placeholder="🔒 Contraseña" required />
      <button type="submit">Ingresar</button>
    </form>
    <p>Ingrese con sus credenciales de empleado</p>
  </div>
</body>
</html>
